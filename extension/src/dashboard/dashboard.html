<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OutFox — Outreach Platform</title>
    <link rel="stylesheet" href="../ui/theme.css" />
    <link rel="stylesheet" href="dashboard.css" />
    <script src="../vendor/apexcharts.min.js"></script>
  </head>
  <body class="waalaxy-layout">
    <!-- Left Navigation Sidebar (240px Pure White) -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <img src="../../icons/icon48.png" width="28" height="28" alt="OutFox" style="border-radius:6px; object-fit:contain;" />
        <span class="logo-text" style="font-size:16px; font-weight:800; color:#0f172a; letter-spacing:-0.3px;">OutFox</span>
      </div>

      <nav class="sidebar-nav">
        <button type="button" class="nav-item is-active" data-view="home">
          <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
          <span class="nav-label">Home</span>
        </button>
        <button type="button" class="nav-item" data-view="prospects">
          <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
          <span class="nav-label">Prospects</span>
        </button>
        <div class="nav-accordion-group" id="nav-group-campaigns">
          <button type="button" class="nav-item has-subnav" data-view="campaigns">
            <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg></span>
            <span class="nav-label">Campaigns</span>
            <span class="nav-chevron">⌵</span>
          </button>
          <div class="sidebar-subnav" id="subnav-campaigns">
            <button type="button" class="subnav-item is-active" data-view="campaigns">
              Campaigns List
            </button>
            <button type="button" class="subnav-item" data-view="templates">
              Message Templates
            </button>
            <button type="button" class="subnav-item" data-view="queue">
              Queue
            </button>
          </div>
        </div>
        <button type="button" class="nav-item" data-view="inbox">
          <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg></span>
          <span class="nav-label">Inbox</span>
        </button>
        <button type="button" class="nav-item" data-view="settings">
          <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></span>
          <span class="nav-label">Settings</span>
        </button>
      </nav>

      <!-- Bottom Profile Widget (Frame 8) -->
      <div class="sidebar-footer">
        <div class="profile-card">
          <div class="profile-avatar">AC</div>
          <div class="profile-meta">
            <span class="profile-name">aditya chaudhary</span>
            <span class="profile-status" id="sidebar-account-status"><span class="status-dot-circle is-active"></span> Currently Active</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content Canvas -->
    <main class="main-canvas">
      <!-- Top Header Bar (Frame 8) -->
      <header class="topbar">
        <div class="topbar-left">
          <span class="topbar-crumb" id="topbar-crumb-title">Home</span>
        </div>
        <div class="topbar-actions">
          <button type="button" class="btn-primary-start-camp" id="btn-topbar-new-campaign" style="padding: 7px 16px; font-size: 12px;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg> Start a campaign
          </button>
          <div class="user-pill" id="topbar-user-pill">
            <div class="user-avatar-mini" id="topbar-user-avatar">AC</div>
            <span id="topbar-user-fullname">aditya chaudhary ⌵</span>
          </div>
        </div>
      </header>

      <!-- Dynamic Content Root -->
      <section class="content-body" id="app-root"></section>
    </main>

    <!-- Toast container for feedback -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Floating Live Logs Pill Badge (Non-intrusive 32px pill in bottom-right) -->
    <button type="button" id="outfox-logs-pill" class="outfox-logs-pill" title="Toggle Live Engine Logs">
      <span class="pulse-dot"></span>
      <span class="logs-pill-label">Live Logs</span>
      <span class="log-count-badge" id="terminal-log-count">0</span>
    </button>

    <!-- Slide-up Floating Terminal Modal / Drawer -->
    <div id="outfox-terminal-modal" class="terminal-modal hidden">
      <div class="terminal-header">
        <div class="terminal-title">
          <span class="pulse-dot"></span>
          <span>Live Engine Logs</span>
        </div>
        <div class="terminal-controls">
          <button type="button" id="btn-copy-logs" class="term-btn">Copy</button>
          <button type="button" id="btn-clear-logs" class="term-btn">Clear</button>
          <button type="button" id="btn-close-terminal" class="term-btn">✕</button>
        </div>
      </div>
      <div class="terminal-body" id="terminal-log-stream">
        <!-- Live log entries stream here -->
      </div>
    </div>

    <script type="module" src="dashboard.js"></script>
  </body>
</html>
